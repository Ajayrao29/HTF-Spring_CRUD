<div class="container">
  <h2>Products List</h2>
  <div *ngIf="products.length === 0" class="no-products">
    No products available.
  </div>
  <div *ngFor="let product of products" class="product-row">
    <div class="product-info">
      <span class="product-name">{{ product.name }}</span>
      <span class="product-details">{{ product.description }} - ${{ product.price }} (Qty: {{ product.quantity }})</span>
    </div>
    <div class="product-actions">
      <button class="edit-btn" (click)="onEdit(product.id)">Edit</button>
      <button class="delete-btn" (click)="onDelete(product.id)">Delete</button>
    </div>
  </div>
</div>
